name: diagnose site reachability
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Run the crawler's own HTTP client against company sites
        run: |
          python - <<'PY'
          import time
          from impurity_leads.config import load_settings
          from impurity_leads.execution.http import CrawlClient, HostGate
          from impurity_leads.zero_cost import ProviderUsage
          from impurity_leads.crawling.robots import RobotsPolicy
          from impurity_leads.execution.retry import TaskFailure
          import threading
          class Runner:
              stop = threading.Event()
          class Ctx:
              runner = Runner()
              def check(self): pass
              def before_request(self): pass
          settings = load_settings()
          print("user_agent:", settings.user_agent, "timeout:", settings.request_timeout_seconds, "delay:", settings.per_domain_delay_seconds)
          gate = HostGate(settings.per_domain_delay_seconds)
          domains = ["takeda.com","sandoz.com","cipla.com","novartis.com","lilly.com","roche.com","lupin.com","zydus.co.in","gilead.com","bayer.com"]
          with CrawlClient(Ctx(), settings, gate, usage=ProviderUsage()) as client:
              for d in domains:
                  t = time.time()
                  try:
                      r = client.get(f"https://{d}/robots.txt", headers={"User-Agent": settings.user_agent})
                      robots = f"{r.status_code} final={r.url}"
                  except Exception as e:
                      robots = f"ERR {type(e).__name__}: {str(e)[:80]} {getattr(e,'args',[''])[0] if e.args else ''}"
                  try:
                      h = client.get(f"https://{d}/", headers={"User-Agent": settings.user_agent})
                      home = f"{h.status_code} final={h.url} bytes={len(h.content)}"
                  except Exception as e:
                      home = f"ERR {type(e).__name__}: {str(e)[:80]}"
                  print(f"{d:14s} robots={robots} | home={home} | {time.time()-t:.1f}s", flush=True)
          PY
