name: apply database migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "scripts/apply_migrations.py", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2"
        if: env.SUPABASE_DB_URL != ''
      - name: Apply new migrations in order
        if: env.SUPABASE_DB_URL != ''
        run: python scripts/apply_migrations.py
      - name: Explain skipped migrations
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::SUPABASE_DB_URL is not set, so migrations were not applied."
